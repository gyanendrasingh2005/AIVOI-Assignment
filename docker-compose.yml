version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (PharmaRCA QMS Store)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: pharmarca_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-pharmarca_qms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pharmarca_qms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmarca_network

  # ============================================================================
  # PharmaRCA FastAPI Backend (AI Orchestration & GxP Engine)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmarca_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PROJECT_NAME=PharmaRCA Enterprise Platform
      - VERSION=1.0.0
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-replace_in_production_with_a_secure_random_key_min32chars}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-pharmarca_qms}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-pharmarca_qms}
      - STORAGE_DIR=/app/storage/evidence
      - MAX_UPLOAD_SIZE_BYTES=52428800
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_TEMPERATURE=0.1
      - GROQ_MAX_RETRIES=3
      - BACKEND_CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:3000", "http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    volumes:
      - evidence_storage:/app/storage/evidence
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - pharmarca_network

  # ============================================================================
  # PharmaRCA React + Vite + Nginx Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmarca_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - pharmarca_network

volumes:
  pgdata:
    driver: local
  evidence_storage:
    driver: local

networks:
  pharmarca_network:
    driver: bridge

